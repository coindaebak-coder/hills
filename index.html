<script src="assets/js/config.js"></script>
<script src="assets/js/layout.js"></script>
<script>
  (function () {
    var KEY = 'hidePopup205';
    var pop = document.getElementById('main-popup');
    var hideUntil = 0;
    try { hideUntil = +localStorage.getItem(KEY) || 0; } catch (e) {}
    if (Date.now() < hideUntil) return;
    pop.hidden = false;
    function close() {
      if (document.getElementById('popup-today').checked) {
        try { localStorage.setItem(KEY, Date.now() + 864e5); } catch (e) {}
      }
      pop.hidden = true;
    }
    document.getElementById('popup-close').addEventListener('click', close);
    document.getElementById('popup-today').addEventListener('change', close);
    pop.addEventListener('click', function (e) { if (e.target === pop) close(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !pop.hidden) close(); });
  })();
</script>
