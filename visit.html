<!DOCTYPE html>
<html lang="ko" data-theme="hillstate">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오시는길 | 힐스테이트 중외공원</title>
<meta name="description" content="힐스테이트 중외공원 오시는길">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Serif+KR:wght@500;600&display=swap">
<link rel="stylesheet" href="assets/css/theme-hillstate.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<main>
  <section class="sub-visual">
    <div>
      <p class="en">LOCATION MAP</p>
      <h1>오시는길</h1>
    </div>
  </section>


  <section class="section">
    <div class="inner">
      <div class="sec-head" data-reveal>
        <p class="en">MODEL HOUSE</p>
        <h2>견본주택 오시는길</h2>
      </div>
      <div class="ph" data-src="assets/img/visit_map.jpg" data-label="견본주택 약도 이미지 준비중" data-reveal></div>
      <div class="table-wrap" style="margin-top:40px" data-reveal>
        <table class="info-table">
          <tbody>
            <tr><th>견본주택</th><td><span data-site="modelHouse"></span></td></tr>
            <tr><th>현장위치</th><td><span data-site="siteAddress"></span></td></tr>
            <tr><th>분양문의</th><td><a href="#" data-site="tel"></a></td></tr>
          </tbody>
        </table>
      </div>
      <div class="cta" style="margin-top:40px">
        <div class="btns"><a class="btn fill" id="map-link" href="#" target="_blank" rel="noopener">카카오맵으로 보기</a></div>
      </div>
    </div>
  </section>

</main>

<script src="assets/js/config.js"></script>
<script src="assets/js/layout.js"></script>
<script>document.getElementById('map-link').href = window.SITE.mapUrl;</script>
</body>
</html>
